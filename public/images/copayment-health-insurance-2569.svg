<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ประกันสุขภาพเหมาจ่ายกับ Co-payment ปี 2569</title>
  <desc id="desc">ภาพประกอบบทความเรื่องค่ารักษาพยาบาลที่สูงขึ้นและคำถามก่อนเลือกประกันสุขภาพ</desc>
  <rect width="1200" height="630" fill="#f7f8f4"/>
  <rect x="58" y="56" width="1084" height="518" rx="8" fill="#ffffff" stroke="#dce3dd" stroke-width="2"/>
  <circle cx="940" cy="168" r="92" fill="#effdfa" stroke="#0f766e" stroke-width="5"/>
  <path d="M905 162h70M940 127v70" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
  <rect x="750" y="316" width="300" height="34" rx="8" fill="#dce3dd"/>
  <rect x="750" y="316" width="224" height="34" rx="8" fill="#0f766e"/>
  <rect x="750" y="374" width="300" height="34" rx="8" fill="#dce3dd"/>
  <rect x="750" y="374" width="174" height="34" rx="8" fill="#f59e0b"/>
  <rect x="750" y="432" width="300" height="34" rx="8" fill="#dce3dd"/>
  <rect x="750" y="432" width="252" height="34" rx="8" fill="#2563eb"/>
  <text x="104" y="126" fill="#115e59" font-family="Arial, sans-serif" font-size="34" font-weight="700">พี่มิกคลิกทุกแผน</text>
  <text x="104" y="198" fill="#17201d" font-family="Arial, sans-serif" font-size="62" font-weight="800">ประกันสุขภาพเหมาจ่าย</text>
  <text x="104" y="268" fill="#17201d" font-family="Arial, sans-serif" font-size="62" font-weight="800">ยังคุ้มอยู่ไหม?</text>
  <text x="104" y="344" fill="#5c6a64" font-family="Arial, sans-serif" font-size="31">ก่อนซื้อปี 2569 ต้องเข้าใจค่ารักษา</text>
  <text x="104" y="390" fill="#5c6a64" font-family="Arial, sans-serif" font-size="31">OPD / IPD และเงื่อนไข Co-payment</text>
  <rect x="104" y="444" width="430" height="72" rx="8" fill="#fff7df" stroke="#f59e0b" stroke-width="2"/>
  <text x="126" y="490" fill="#17201d" font-family="Arial, sans-serif" font-size="31" font-weight="700">คำถามไม่ใช่ “เบี้ยเท่าไหร่”</text>
  <text x="750" y="292" fill="#17201d" font-family="Arial, sans-serif" font-size="29" font-weight="700">เช็กก่อนตัดสินใจ</text>
  <text x="750" y="305" fill="#17201d" font-family="Arial, sans-serif" font-size="1"> </text>
  <text x="750" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">ค่ารักษาพยาบาล</text>
  <text x="750" y="398" fill="#17201d" font-family="Arial, sans-serif" font-size="22" font-weight="700">เงินสำรอง</text>
  <text x="750" y="456" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">ความคุ้มครองจริง</text>
</svg>
